<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      color: #2b2b2b;
      font-size: 35px;
      background-color: #b6d7a8;
      padding: 15px;
      margin: 0;
    }

    .form-box {
      width: 60%;
      margin: 30px auto;
      background-color: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px gray;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 12px;
      font-size: 18px;
      color: #333;
    }

    input, select, textarea {
      width: 90%;
      padding: 8px;
      border: 1px solid #999;
      border-radius: 5px;
      font-size: 16px;
    }

    input[type="radio"], input[type="checkbox"] {
      width: auto;
    }

    textarea {
      resize: none;
    }

    .btn {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px;
    }

    .submit-btn {
      background-color: #1c8f2e;
      color: white;
    }

    .reset-btn {
      background-color: #ba1d1d;
      color: white;
    }

    .submit-btn:hover {
      background-color: #146d22;
    }

    .reset-btn:hover {
      background-color: #8f1414;
    }
  </style>
</head>

<body>

  <h1>Student Registration Form</h1>

  <div class="form-box">
    <form>
      <table border="0">
        
        <tr style="background-color:#f4cccc;">
          <td><b>Full Name</b></td>
          <td><input type="text" placeholder="Enter your name" required></td>
        </tr>

        <tr style="background-color:#d9ead3;">
          <td><b>Email</b></td>
          <td><input type="email" placeholder="Enter your email" required></td>
        </tr>

        <tr style="background-color:#cfe2f3;">
          <td><b>Password</b></td>
          <td><input type="password" placeholder="Enter password" required></td>
        </tr>

        <tr style="background-color:#fff2cc;">
          <td><b>Phone Number</b></td>
          <td><input type="tel" placeholder="Enter phone number" required></td>
        </tr>

        <tr style="background-color:#ead1dc;">
          <td><b>Date of Birth</b></td>
          <td><input type="date"></td>
        </tr>

        <tr style="background-color:#d0e0e3;">
          <td><b>Gender</b></td>
          <td>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other
          </td>
        </tr>

        <tr style="background-color:#f9cb9c;">
          <td><b>Course</b></td>
          <td>
            <select>
              <option>Select Course</option>
              <option>BCA</option>
              <option>BSc</option>
              <option>BE</option>
              <option>MCA</option>
              <option>MBA</option>
            </select>
          </td>
        </tr>

        <tr style="background-color:#b6d7a8;">
          <td><b>Skills</b></td>
          <td>
            <input type="checkbox"> HTML
            <input type="checkbox"> CSS
            <input type="checkbox"> JavaScript
            <input type="checkbox"> Java
          </td>
        </tr>

        <tr style="background-color:#d9d2e9;">
          <td><b>Address</b></td>
          <td><textarea rows="3" placeholder="Enter address"></textarea></td>
        </tr>

        <tr style="background-color:#fce5cd;">
          <td><b>Upload Photo</b></td>
          <td><input type="file"></td>
        </tr>

        <tr style="background-color:#f4cccc;">
          <td><b>Favorite Color</b></td>
          <td><input type="color"></td>
        </tr>

        <tr style="background-color:#d9ead3;">
          <td><b>Range (0-10)</b></td>
          <td><input type="range" min="0" max="10"></td>
        </tr>

        <tr>
          <td colspan="2" style="text-align:center;">
            <button class="btn submit-btn" type="submit">Submit</button>
            <button class="btn reset-btn" type="reset">Reset</button>
          </td>
        </tr>

      </table>
    </form>
  </div>

</body>
</html>
