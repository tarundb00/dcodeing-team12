<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Happy Birthday!</title>
    <style>
        body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(to right, #ff9a9e, #fad0c4);
    text-align: center;
    overflow: hidden;
}

.happy {
    font-size: 4rem;
    color: #2d2d2d;
    margin-top: 80px;
    animation: bounce 1.5s ease infinite;
}

.wish {
    font-size: 1.8rem;
    color: #3a3a3a;
    margin-top: 20px;
    animation: fadein 2s ease forwards;
}

/* Bouncing text */
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* Fade in */
@keyframes fadein {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Balloons */
.balloons {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

.balloon {
    width: 80px;
    height: 100px;
    background: red;
    border-radius: 50% 50% 50% 50%;
    position: absolute;
    bottom: -150px;
    animation: floatUp 8s infinite ease-in;
}

.one { background: #ff4d4d; left: 20%; animation-delay: 0s; }
.two { background: #ffcc00; left: 50%; animation-delay: 1s; }
.three { background: #66ccff; left: 80%; animation-delay: 0.6s; }

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-800px); opacity: 0; }
}

    </style>
</head>
<body>
    <div class="balloons">
        <div class="balloon one"></div>
        <div class="balloon two"></div>
        <div class="balloon three"></div>
    </div>

    <h1 class="happy">🎉 Happy Birthday! Ty🎂</h1>
    <p class="wish">Wishing you lots of joy, laughter, and love! ❤️</p>
</body>
</html>
